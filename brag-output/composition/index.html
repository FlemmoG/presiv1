    <style>
      html, body { margin: 0; padding: 0; background: #070a12; }
      body { color: #e9eef7; font-family: system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070a12; }
      .clip { position: absolute; inset: 0; }
      .in { position: absolute; inset: 0; opacity: 0; }
      .abs { position: absolute; }
      .vignette { position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 38%, rgba(3,5,10,0.72) 100%); }
      #chrome { position: absolute; left: 60px; top: 44px; z-index: 6; opacity: 0; }
      #chrome .t { font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
      #chrome .s { margin-top: 6px; font-size: 18px; color: #9aa8bd; }
      .step { position: absolute; right: 60px; top: 48px; font-size: 22px; color: #9aa8bd; text-align: right; letter-spacing: 0.02em; }
      .step b { color: #e9eef7; font-weight: 600; }
      .cap { position: absolute; left: 260px; width: 1400px; bottom: 100px; text-align: center; font-size: 38px; line-height: 1.35; font-weight: 300; color: #e9eef7; letter-spacing: 0.01em; }
      .badge { position: absolute; font-size: 20px; color: #9aa8bd; border: 1px solid rgba(255,255,255,0.18); border-radius: 999px; padding: 6px 16px; background: rgba(12,17,28,0.86); white-space: nowrap; }
      .chip { position: absolute; font-size: 24px; color: #e9eef7; border-radius: 10px; padding: 8px 18px; white-space: nowrap; background: rgba(12,17,28,0.86); }
      .lbl { position: absolute; font-size: 20px; text-align: center; white-space: nowrap; }
      .cell { position: absolute; box-sizing: border-box; }
      .num { position: absolute; text-align: center; color: #e9eef7; }
      .glow { position: absolute; inset: -14px; filter: blur(22px); opacity: 0.12; border-radius: 12px; }
    </style>

  <body>

      <audio id="music" src="assets/music/happy-beats-business-moves-vol-12-by-ende-dot-app.mp3" data-start="0" data-duration="48" data-track-index="0" data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0},{"t":1.5,"v":0.3},{"t":34,"v":0.3},{"t":36,"v":0.4},{"t":41,"v":0.35},{"t":47.8,"v":0}]}]}'></audio>

      <audio id="sfx22" src="assets/sfx/bong_001.ogg" data-start="36.57" data-duration="1" data-track-index="23" data-volume="0.5"></audio>
      <audio id="sfx23" src="assets/sfx/click_002.ogg" data-start="36.84" data-duration="1" data-track-index="24" data-volume="0.22"></audio>
      <audio id="sfx24" src="assets/sfx/click_002.ogg" data-start="37.11" data-duration="1" data-track-index="25" data-volume="0.22"></audio>
      <audio id="sfx25" src="assets/sfx/click_002.ogg" data-start="37.38" data-duration="1" data-track-index="26" data-volume="0.22"></audio>
      <audio id="sfx26" src="assets/sfx/click_002.ogg" data-start="37.65" data-duration="1" data-track-index="27" data-volume="0.22"></audio>
      <audio id="sfx27" src="assets/sfx/click_002.ogg" data-start="37.92" data-duration="1" data-track-index="28" data-volume="0.22"></audio>

    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      const mk = (parent, cls, css, html) => {
        const e = document.createElement("div");
        if (cls) e.className = cls;
        if (css) e.style.cssText = css;
        if (html != null) e.innerHTML = html;
        parent.appendChild(e);
        return e;
      };
      const rgba = (hex, a) => {
        const n = parseInt(hex.slice(1), 16);
        return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
      };
      let OFF = 0;
      const T = {
        fromTo: (e, a, b, t) => tl.fromTo(e, a, b, t + OFF),
        to: (e, v, t) => tl.to(e, v, t + OFF),
        set: (e, v, t) => tl.set(e, v, t + OFF),
      };
      const show = (el, t, d = 0.6, y = 14) =>
        tl.fromTo(el, { opacity: 0, y }, { opacity: 1, y: 0, duration: d, ease: "power2.out" }, t + OFF);
      const hide = (el, t, d = 0.5) => tl.to(el, { opacity: 0, duration: d, ease: "power1.inOut" }, t + OFF);
      const hash = (x, y, s = 0) => { const n = Math.sin(x * 127.1 + y * 311.7 + s * 74.7) * 43758.5453; return n - Math.floor(n); };
      const clamp = (v) => Math.min(1, Math.max(0, v));

      const C = { conv: "#4ea8ff", pool: "#3ddc97", dense: "#ff9f45", out: "#b57bff", soft: "#7f8da3", input: "#8fa6c4", ink: "#e9eef7", dim: "#9aa8bd" };

      // scene wrappers: fade in at start, out at end (overlap = crossfade)
      const S = [
        { id: "s1in", t: 0, d: 6.5 }, { id: "s2in", t: 6, d: 7.5 }, { id: "s3in", t: 13, d: 8.5 },
        { id: "s4in", t: 21, d: 7.5 }, { id: "s5in", t: 28, d: 6.5 }, { id: "s6in", t: 34, d: 7.5 }, { id: "s7in", t: 41, d: 7 },
      ];
      S.forEach((s, i) => {
        tl.fromTo("#" + s.id, { opacity: 0 }, { opacity: 1, duration: i === 0 ? 0.8 : 0.6, ease: "power1.inOut" }, s.t);
        if (i < S.length - 1) tl.to("#" + s.id, { opacity: 0, duration: 0.5, ease: "power1.inOut" }, s.t + s.d - 0.5);
      });
      tl.to("#s7in", { opacity: 0, duration: 0.5 }, 47.5);

      // persistent title chrome across the tour scenes
      tl.fromTo("#chrome", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 6.4);
      tl.to("#chrome", { opacity: 0, duration: 0.5 }, 40.5);

      const stepEl = (parent, html, t) => {
        const e = mk(parent, "step", null, html);
        show(e, t, 0.5, -8);
      };
      const caption = (parent, text, t, t2) => {
        const e = mk(parent, "cap", null, text);
        show(e, t, 0.7, 12);
        if (t2 != null) hide(e, t2, 0.4);
        return e;
      };

      /* ---------------- Scene 1: the hook ---------------- */
      (() => {
        const p = document.getElementById("s1in"); OFF = 0;
        const l1 = mk(p, "abs", "left:120px;top:330px;width:800px;font-size:60px;line-height:1.2;font-weight:300;", "The model never receives the concept “dog.”");
        const l2 = mk(p, "abs", "left:120px;top:590px;width:800px;font-size:60px;font-weight:300;color:" + C.conv + ";", "It receives numbers.");
        show(l1, 0.6, 0.9, 14);
        show(l2, 3.2, 0.8, 14);

        // conceptual dog image on an 8x8 grid (illustration, not real data)
        const N = 8, CELL = 84, GX = 1010, GY = 190;
        const inDog = (x, y) => {
          const e = (cx, cy, rx, ry) => ((x - cx) / rx) ** 2 + ((y - cy) / ry) ** 2 <= 1;
          return e(4.6, 5.0, 2.6, 1.35) || e(2.0, 3.3, 1.25, 1.2) || e(0.95, 3.7, 0.65, 0.5) || e(2.5, 2.1, 0.45, 0.7) ||
            (x > 3.0 && x < 3.7 && y > 5.5 && y < 7.5) || (x > 5.7 && x < 6.4 && y > 5.5 && y < 7.5) || (x > 7.0 && x < 7.9 && y > 3.6 && y < 4.4);
        };
        const svg = mk(p, "abs", `left:${GX}px;top:${GY}px;width:${N * CELL}px;height:${N * CELL}px;border-radius:6px;overflow:hidden;`,
          `<svg width="${N * CELL}" height="${N * CELL}" viewBox="0 0 8 8"><defs><linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f6f98"/><stop offset="1" stop-color="#2c4a66"/></linearGradient></defs>
          <rect width="8" height="8" fill="url(#bg1)"/>
          <ellipse cx="4.6" cy="5" rx="2.6" ry="1.35" fill="#c4925a"/><circle cx="2" cy="3.3" r="1.25" fill="#c4925a"/><ellipse cx="0.95" cy="3.7" rx="0.65" ry="0.5" fill="#a8763f"/>
          <ellipse cx="2.5" cy="2.1" rx="0.45" ry="0.7" fill="#8a5c30"/><rect x="3" y="5.5" width="0.7" height="2" rx="0.3" fill="#c4925a"/><rect x="5.7" y="5.5" width="0.7" height="2" rx="0.3" fill="#c4925a"/>
          <rect x="7" y="3.6" width="0.9" height="0.8" rx="0.35" fill="#c4925a"/></svg>`);
        show(svg, 0.9, 1.0, 0);
        T.to(svg, { opacity: 0, duration: 0.9, ease: "power1.inOut" }, 2.4);

        const cells = [];
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const d = inDog(x + 0.5, y + 0.5);
          const g = hash(x, y, 5) * 26 - 13;
          const rgb = d ? [196 + g, 146 + g, 90 + g] : [60 + g * 0.5, 96 + g * 0.5, 126 + g * 0.5];
          const c = mk(p, "cell", `left:${GX + x * CELL}px;top:${GY + y * CELL}px;width:${CELL}px;height:${CELL}px;background:rgb(${rgb.map((v) => Math.round(v)).join(",")});border:1px solid rgba(7,10,18,0.5);`);
          const n = mk(c, "num", `left:0;top:0;width:${CELL}px;height:${CELL}px;line-height:${CELL}px;font-size:24px;background:rgba(7,10,18,0.72);`, Math.round(rgb[0]));
          cells.push({ c, n, k: x + y });
        }
        cells.forEach(({ c, n, k }) => {
          T.fromTo(c, { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 2.4 + k * 0.07);
          T.fromTo(n, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 2.9 + k * 0.07);
        });
        const b = mk(p, "badge", `left:${GX}px;top:${GY + N * CELL + 24}px;`, "Conceptual close-up · an 8 × 8 corner of 224 × 224 × 3 values");
        show(b, 3.4, 0.6, 8);
      })();

      /* ---------------- Scene 2: whole architecture ---------------- */
      const glowSel = [];
      (() => {
        const p = document.getElementById("s2in"); OFF = 6;
        stepEl(p, "<b>Overview</b> · the whole architecture", 0.5);
        const legend = [[C.conv, "Convolutional processing"], [C.pool, "Pooling"], [C.dense, "Dense / fully connected"], [C.soft, "Softmax (not a learned layer)"], [C.out, "Classification output"]];
        legend.forEach(([col, txt], i) => {
          const r = mk(p, "abs", `right:60px;top:${104 + i * 30}px;font-size:18px;color:#9aa8bd;white-space:nowrap;`, `${txt} <span style="display:inline-block;width:12px;height:12px;border-radius:3px;margin-left:10px;background:${col}"></span>`);
          show(r, 0.9 + i * 0.1, 0.5, 6);
        });
        const L = [
          ["Input", "224×224×3", C.input, 26, 190], ["Conv1", "55×55×96", C.conv, 40, 170], ["Pool1", "27×27×96", C.pool, 40, 120],
          ["Conv2", "27×27×256", C.conv, 58, 130], ["Pool2", "13×13×256", C.pool, 58, 90], ["Conv3", "13×13×384", C.conv, 70, 90],
          ["Conv4", "13×13×384", C.conv, 70, 90], ["Conv5", "13×13×256", C.conv, 58, 90], ["Pool5", "6×6×256", C.pool, 58, 64],
          ["FC6", "4,096", C.dense, 24, 300], ["FC7", "4,096", C.dense, 24, 300], ["FC8", "1,000", C.dense, 24, 200],
          ["Softmax", "σ", C.soft, 60, 60], ["Output", "1,000 probs", C.out, 26, 200],
        ];
        const cx = (i) => 120 + 60 + i * 120;
        L.forEach(([name, shape, col, w, h], i) => {
          const t0 = 0.45 + i * 0.2727;
          const blk = mk(p, "abs", `left:${cx(i) - w / 2}px;top:${540 - h / 2}px;width:${w}px;height:${h}px;`);
          const gl = mk(blk, "glow", `background:${col};`);
          glowSel.push(gl);
          const face = mk(blk, "abs", `inset:0;border:2px solid ${col};background:${rgba(col, 0.16)};border-radius:5px;box-shadow:10px -10px 0 ${rgba(col, 0.16)},20px -20px 0 ${rgba(col, 0.08)};`);
          if (name === "Softmax") face.innerHTML = `<div style="text-align:center;line-height:${h - 4}px;font-size:34px;color:${C.ink}">σ</div>`;
          const l1 = mk(p, "lbl", `left:${cx(i) - 60}px;width:120px;top:710px;color:${col};font-weight:600;`, name);
          const l2 = mk(p, "lbl", `left:${cx(i) - 60}px;width:120px;top:742px;font-size:17px;color:#9aa8bd;`, name === "Softmax" ? "not a learned layer" : shape);
          if (name === "Softmax") l2.style.whiteSpace = "normal";
          [blk, l1, l2].forEach((e) => show(e, t0, 0.5, 18));
        });
        const brace = (i0, i1, txt, col, t) => {
          const x0 = cx(i0) - 55, x1 = cx(i1) + 55;
          const ln = mk(p, "abs", `left:${x0}px;width:${x1 - x0}px;top:296px;height:3px;background:${col};border-radius:2px;`);
          const tx = mk(p, "abs", `left:${x0}px;width:${x1 - x0}px;top:250px;text-align:center;font-size:24px;color:${col};`, txt);
          show(ln, t, 0.6, 0); show(tx, t, 0.6, 8);
        };
        brace(1, 8, "Five convolutional layers", C.conv, 3.6);
        brace(9, 11, "Three fully connected layers", C.dense, 3.9);
        caption(p, "AlexNet contains five convolutional layers followed by three fully connected layers.", 2.74);
      })();

      /* ---------------- Scene 3: one filter, one feature map ---------------- */
      (() => {
        const p = document.getElementById("s3in"); OFF = 13;
        stepEl(p, "<b>Step 2 of 7</b> · Conv1 and the 11 × 11 filter", 0.4);
        const N = 27, CS = 20, PX = 180, PY = 190;
        const patch = [];
        for (let y = 0; y < N; y++) { const row = []; for (let x = 0; x < N; x++) {
          const t = (x - y) / N, edge = 1 / (1 + Math.exp(-t * 7)), gr = (hash(x, y, 3) - 0.5) * 0.14;
          const r = clamp(0.22 + edge * 0.68 + gr), g = clamp(0.30 + edge * 0.34 + gr), b = clamp(0.68 - edge * 0.5 + gr);
          row.push({ r, g, b, lum: 0.299 * r + 0.587 * g + 0.114 * b }); } patch.push(row); }
        const grid = mk(p, "abs", `left:${PX}px;top:${PY}px;width:${N * CS}px;height:${N * CS}px;`);
        for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
          const c = patch[y][x];
          mk(grid, "cell", `left:${x * CS}px;top:${y * CS}px;width:${CS}px;height:${CS}px;background:rgb(${Math.round(c.r * 255)},${Math.round(c.g * 255)},${Math.round(c.b * 255)});`);
        }
        show(grid, 0.3, 0.8, 0);
        const bd = mk(p, "badge", `left:${PX}px;top:${PY - 50}px;`, "Conceptual close-up · a 27 × 27 patch");
        show(bd, 0.5, 0.5, 6);
        const chipA = mk(p, "chip", `left:${PX}px;top:${PY + N * CS + 26}px;border:1px solid ${rgba(C.conv, 0.6)};`, "Conv1 filter: 11 × 11 × 3");
        const chipB = mk(p, "chip", `left:${PX + 330}px;top:${PY + N * CS + 26}px;border:1px solid ${rgba(C.conv, 0.6)};`, "Stride: 4");
        show(chipA, 0.9, 0.5, 8); show(chipB, 1.1, 0.5, 8);

        // three conceptual filters -> three normalised response maps (5x5 positions)
        const resp = { edge: [], color: [], texture: [] };
        for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++) {
          let e = 0, c = 0, m = 0, m2 = 0;
          for (let dj = 0; dj < 11; dj++) for (let di = 0; di < 11; di++) {
            const px = patch[j * 4 + dj][i * 4 + di], u = di / 10 - 0.5, v = dj / 10 - 0.5;
            e += px.lum * (u - v); c += (px.r - px.b) * (1 - Math.abs(u) - Math.abs(v) * 0.5); m += px.lum; m2 += px.lum * px.lum;
          }
          m /= 121; resp.edge.push(e); resp.color.push(c); resp.texture.push(m2 / 121 - m * m);
        }
        const norm = (a) => { const lo = Math.min(...a), hi = Math.max(...a); return a.map((v) => (v - lo) / (hi - lo || 1)); };
        Object.keys(resp).forEach((k) => (resp[k] = norm(resp[k])));

        const drawMap = (parent, vals, cs, x, y, withNum) => {
          const g = mk(parent, "abs", `left:${x}px;top:${y}px;width:${5 * cs}px;height:${5 * cs}px;`);
          const cells = vals.map((v, k) => {
            const c = mk(g, "cell", `left:${(k % 5) * cs}px;top:${Math.floor(k / 5) * cs}px;width:${cs}px;height:${cs}px;background:${rgba(C.conv, 0.08 + 0.5 * v)};border:1px solid rgba(255,255,255,0.1);`);
            if (withNum) mk(c, "num", `left:0;top:0;width:${cs}px;line-height:${cs}px;font-size:20px;`, v.toFixed(1));
            return c;
          });
          return { g, cells };
        };
        const big = drawMap(p, resp.edge, 70, 1080, 290, true);
